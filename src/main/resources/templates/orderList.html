<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>배달 주문 목록</title>
  <meta charset="UTF-8">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    .order-card {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px;
      border-radius: 5px;
    }
    .deliver-btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .deliver-btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
<h1>배달 주문 목록</h1>
<div id="orderList"></div>

<script>
  $(document).ready(function() {
    // 초기 로딩 시 "배달전" 상태의 주문 목록을 가져옴
    loadOrders("배달전");

    // 주문 목록을 가져오는 함수
    function loadOrders(status) {
      $.ajax({
        url: '/orderList/receiveStatus',
        type: 'GET',
        data: { status: status },
        success: function(orders) {
          $('#orderList').empty();
          orders.forEach(function(order) {
            const orderHtml = `
              <div id="order-${order.orderId}" class="order-card">
                <h3>주문 번호: ${order.orderId}</h3>
                <p>고객명: ${order.userId}</p>
                <p>메시지: ${order.messageBody}</p>
                <button class="deliver-btn" onclick="takeDelivery('${order.orderId}', '${order.userId}', '${order.messageBody}')">배달 가져가기</button>
              </div>
            `;
            $('#orderList').append(orderHtml);
          });
        },
        error: function() {
          alert('주문 목록을 가져오는 데 실패했습니다.');
        }
      });
    }

    // 주문 상태를 "배달중"으로 업데이트하는 함수
    window.takeDelivery = function(orderId, userId, messageBody) {
      if (confirm('이 주문을 배달하시겠습니까?')) {
        const orderData = {
          orderId: orderId,
          userId: userId,
          message: messageBody,
          status: '배달중'
        };

        $.ajax({
          url: '/orderList/orderSend',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(orderData),
          success: function() {
            $(`#order-${orderId}`).fadeOut(300, function() {
              $(this).remove();
            });
            alert('배달이 시작되었습니다.');
          },
          error: function() {
            alert('오류가 발생했습니다. 다시 시도해주세요.');
          }
        });
      }
    }
  });
</script>
</body>
</html>
