<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달 추적</title>
    <link th:href="@{/css/delivery-tracking.css}" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="left-section">
        <!-- 배달 현황 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">배달 현황</span>
            </div>
            <div class="card-content">
                <div class="map-placeholder">
                    <img src="/api/placeholder/400/320" alt="지도">
                </div>
                <div class="info">
                    <p class="time-info">예상 도착 시간: 14:40</p>
                    <p>배달원까지의 거리: 1.2km</p>
                </div>
            </div>
        </div>

        <!-- 주문 내역 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">주문 내역</span>
            </div>
            <div class="card-content">
                <div class="order-details">
                    <div>
                        <p class="restaurant-name">서브웨이 강남점</p>
                        <p class="text-sm text-gray-500">주문번호: ORDER-123456</p>
                    </div>
                    <div>
                        <div class="order-item">
                            <p>이탈리안 BMT</p>
                            <p class="options">15cm, 화이트, 양상추, 토마토</p>
                            <p class="price">8,900원</p>
                        </div>
                        <div class="order-item">
                            <p>쿠키</p>
                            <p class="options">더블 초코칩</p>
                            <p class="price">1,500원</p>
                        </div>
                    </div>
                    <p class="text-right font-bold">총 결제금액: 10,400원</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 오른쪽 섹션: 채팅 -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">배달원과 채팅</span>
        </div>
        <div class="card-content">
            <div id="user-chat" class="h-[400px] overflow-y-auto space-y-4 mb-4"></div>
            <div id="rider-chat" class="h-[400px] overflow-y-auto space-y-4 mb-4"></div>
            <form id="message-form" class="form">
                <input type="text" id="new-message" placeholder="메시지를 입력하세요" />
                <button type="submit">전송</button>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        const orderId = "ORDER-123456"; // 실제 주문 ID로 변경

        // 채팅 메시지 표시 함수
        function displayChatMessages(role, messages) {
            const chatContainer = $('#' + role + '-chat');
            messages.forEach(message => {
                const messageElement = $('<div></div>').text(message.message);
                chatContainer.append(messageElement);
            });
        }

        // 채팅 메시지 받아오기 (5초마다 실행)
        function fetchMessages() {
            $.ajax({
                url: '/api/chat/messages',
                method: 'GET',
                data: { orderId: orderId },
                success: function (data) {
                    // 각 역할에 맞는 메시지 리스트 처리
                    if (data.user) {
                        displayChatMessages('user', data.user);
                    }
                    if (data.rider) {
                        displayChatMessages('rider', data.rider);
                    }
                },
                error: function (error) {
                    console.log('메시지 가져오기 실패:', error);
                }
            });
        }

        // 5초마다 메시지 가져오기
        setInterval(fetchMessages, 5000); // 5초마다 실행

        // 메시지 전송
        $('#message-form').on('submit', function (e) {
            e.preventDefault();
            const newMessage = $('#new-message').val().trim();
            if (!newMessage) return;

            const currentTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

            // 서버로 메시지 보내기
            const chatRequestDTO = {
                orderId: orderId,
                userId: 'userId',
                role: 'user', // 역할 설정 (예: 'user' or 'rider')
                message: newMessage
            };

            $.ajax({
                url: '/api/chat/send',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(chatRequestDTO),
                success: function (response) {
                    // 성공 시 새로운 메시지를 채팅에 추가
                    const newMsg = {
                        sender: 'user',
                        message: newMessage,
                        time: currentTime
                    };

                    // 사용자 메시지 추가
                    if (!data.user) {
                        data.user = [];
                    }
                    data.user.push(newMsg);
                    displayChatMessages('user', data.user);
                    $('#new-message').val(''); // 입력창 초기화
                },
                error: function (error) {
                    alert('메시지 전송에 실패했습니다.');
                }
            });
        });
    });
</script>
</body>
</html>
