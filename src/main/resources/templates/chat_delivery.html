<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달 추적</title>
    <link th:href="@{/css/delivery-tracking.css}" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="left-section">
        <!-- 배달 현황 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">배달 현황</span>
            </div>
            <div class="card-content">
                <div class="map-placeholder">
                    <img src="/api/placeholder/400/320" alt="지도">
                </div>
                <div class="info">
                    <p class="time-info">예상 도착 시간: 14:40</p>
                    <p>배달원까지의 거리: 1.2km</p>
                </div>
            </div>
        </div>

        <!-- 주문 내역 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">주문 내역</span>
            </div>
            <div class="card-content">
                <div class="order-details">
                    <div>
                        <p class="restaurant-name">서브웨이 강남점</p>
                        <p class="text-sm text-gray-500">주문번호: ORDER-123456</p>
                    </div>
                    <div>
                        <div class="order-item">
                            <p>이탈리안 BMT</p>
                            <p class="options">15cm, 화이트, 양상추, 토마토</p>
                            <p class="price">8,900원</p>
                        </div>
                        <div class="order-item">
                            <p>쿠키</p>
                            <p class="options">더블 초코칩</p>
                            <p class="price">1,500원</p>
                        </div>
                    </div>
                    <p class="text-right font-bold">총 결제금액: 10,400원</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 오른쪽 섹션: 채팅 -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">배달원과 채팅</span>
        </div>
        <div class="card-content">
            <div id="messages" class="h-[400px] overflow-y-auto space-y-4 mb-4"></div>
            <form id="message-form" class="form">
                <input type="text" id="new-message" placeholder="메시지를 입력하세요" />
                <button type="submit">전송</button>
            </form>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        const messages = [
            { id: 1, sender: 'customer', text: '문 앞에 놓아주세요', time: '14:30' },
            { id: 2, sender: 'rider', text: '알겠습니다. 10분 후 도착예정입니다', time: '14:31' }
        ];

        // 메시지 표시
        function displayMessages() {
            $('#messages').empty();
            messages.forEach(message => {
                const messageClass = message.sender === 'customer' ? 'customer-message' : 'rider-message';
                $('#messages').append(`
            <div class="message ${messageClass}">
              <p>${message.text}</p>
              <p class="message-time">${message.time}</p>
            </div>
          `);
            });
        }

        displayMessages();

        // 메시지 전송
        $('#message-form').on('submit', function (e) {
            e.preventDefault();
            const newMessage = $('#new-message').val().trim();
            if (!newMessage) return;

            const currentTime = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            const newMsg = {
                id: messages.length + 1,
                sender: 'customer',
                text: newMessage,
                time: currentTime
            };
            messages.push(newMsg);
            displayMessages();
            $('#new-message').val('');
        });
    });
</script>
</body>
</html>
