<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달 추적</title>
    <link th:href="@{/css/delivery-tracking.css}" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="left-section">
        <!-- 배달 현황 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">배달 현황</span>
            </div>
            <div class="card-content">
                <div class="map-placeholder">
                    <img src="/api/placeholder/400/320" alt="지도">
                </div>
                <div class="info">
                    <p class="time-info">예상 도착 시간: 14:40</p>
                    <p>배달원까지의 거리: 1.2km</p>
                </div>
            </div>
        </div>

        <!-- 주문 내역 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">주문 내역</span>
            </div>
            <div class="card-content">
                <div class="order-details">
                    <div>
                        <p class="restaurant-name">서브웨이 강남점</p>
                        <p class="text-sm text-gray-500">주문번호: ORDER-123456</p>
                    </div>
                    <div>
                        <div class="order-item">
                            <p>이탈리안 BMT</p>
                            <p class="options">15cm, 화이트, 양상추, 토마토</p>
                            <p class="price">8,900원</p>
                        </div>
                        <div class="order-item">
                            <p>쿠키</p>
                            <p class="options">더블 초코칩</p>
                            <p class="price">1,500원</p>
                        </div>
                    </div>
                    <p class="text-right font-bold">총 결제금액: 10,400원</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 오른쪽 섹션: 채팅 -->
    <div class="card">
        <div class="card-header">
            <span class="card-title">배달원과 채팅</span>
        </div>
        <div class="card-content">
            <div id="chatContainer" class="h-[400px] overflow-y-auto space-y-4 mb-4"></div>
            <form id="message-form" class="form">
                <input type="text" id="new-message" placeholder="메시지를 입력하세요" />
                <button type="submit">전송</button>
            </form>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        const orderId = "ORDER-123456"; // 실제 주문 ID로 변경
        let chatMessages = []; // 기존 메시지를 유지하기 위한 배열
        let lastTimestamp = -1;  // 최신 타임스탬프 저장

        // 채팅 메시지 표시 함수
        function displayChatMessages(messages) {
            const chatContainer = $('#chatContainer');

            // 메시지 순차적으로 출력
            messages.forEach(message => {
                let messageElement = $('<div class="message"></div>');

                // user는 오른쪽, rider는 왼쪽
                if (message.role === 'user') {
                    messageElement.addClass('user-message'); // user 스타일
                    messageElement.text(message.message);
                } else {
                    messageElement.addClass('rider-message'); // rider 스타일
                    messageElement.text(message.message);
                }

                // 메시지 추가
                chatContainer.append(messageElement);
            });

            // 스크롤을 아래로 자동 이동
            chatContainer.scrollTop(chatContainer.prop('scrollHeight'));
        }

        function fetchMessages() {
            $.ajax({
                url: '/api/chat/messages',
                method: 'GET',
                data: {
                    orderId: orderId,
                    fromTimestamp: lastTimestamp
                },
                success: function (data) {
                    // 새 메시지 가져오기
                    let userMessages = data.user || [];
                    let riderMessages = data.rider || [];

                    // 교차로 출력
                    let newMessages = mergeMessages(userMessages, riderMessages);

                    // 기존 메시지 배열에 추가
                    chatMessages = [...chatMessages, ...newMessages];

                    // 새로운 메시지만 표시
                    displayChatMessages(newMessages);

                    // 최신 타임스탬프 업데이트
                    if (newMessages.length > 0) {
                        lastTimestamp = newMessages[newMessages.length - 1].timestamp;
                    }
                },
                error: function (error) {
                    console.log('메시지 가져오기 실패:', error);
                }
            });
        }

        // 메시지들을 타임스탬프 기준으로 교차로 합치는 함수
        function mergeMessages(userMessages, riderMessages) {
            let mergedMessages = [];
            let i = 0, j = 0;

            while (i < userMessages.length || j < riderMessages.length) {
                if (i < userMessages.length && (j >= riderMessages.length || userMessages[i].timestamp <= riderMessages[j].timestamp)) {
                    mergedMessages.push({ ...userMessages[i], role: 'user' });
                    i++;
                } else if (j < riderMessages.length) {
                    mergedMessages.push({ ...riderMessages[j], role: 'rider' });
                    j++;
                }
            }

            return mergedMessages;
        }

        // 초기 메시지 호출
        fetchMessages();

        // 5초마다 새로운 메시지 가져오기
        setInterval(fetchMessages, 5000);

        // 메시지 전송
        $('#message-form').on('submit', function (e) {
            e.preventDefault();
            const newMessage = $('#new-message').val().trim();
            if (!newMessage) return;

            const chatRequestDTO = {
                orderId: orderId,
                userId: 'userId',
                role: 'rider', // 역할 설정 (예: 'user' or 'rider')
                message: newMessage
            };

            $.ajax({
                url: '/api/chat/send',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(chatRequestDTO),
                success: function () {
                    // 성공 시 새로운 메시지를 다시 가져옴
                    fetchMessages();
                    $('#new-message').val(''); // 입력창 초기화
                },
                error: function (error) {
                    alert('메시지 전송에 실패했습니다.');
                }
            });
        });
    });
</script>

</body>
</html>
