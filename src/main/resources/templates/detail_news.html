<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Details</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script th:src="@{/js/community/detailnews.js}"></script>
  <script th:src="@{/js/select.js}"></script>
  <link th:href="@{/css/main.css}" rel="stylesheet">
  <link th:href="@{/css/common.css}" rel="stylesheet">
  <link th:href="@{/css/news.css}" rel="stylesheet">
  <script th:src="@{/js/dropdown.js}"></script>
  <title>선택창</title>
</head>
<body>
<input id="hiddenSectionId" type="hidden" th:value="${sectionId}">
<div class="navbar">
  <!-- Rectangle 7 (background gradient) -->
  <div class="rectangle7"></div>

  <!-- Logo Image -->
  <a th:href="@{/main}" class="logo"></a>

  <!-- Menu Items -->
  <div class="menu" id="menuList">
    <a th:href="@{/menu}" class="menu-item menu-1">메뉴소개</a>
    <a th:href="@{/howtouse}" class="menu-item menu-2">이용방법</a>
    <div class="dropdown">
      <a class="menu-item menu-3" onclick="toggleDropdown()">커뮤니티</a>
      <div class="dropdown-content">
        <a th:href="@{/news}">새소식</a>
        <a th:href="@{/review}">리뷰</a>
      </div>
    </div>
    <a th:href="@{/market}" class="menu-item menu-4">가맹점</a>
    <a th:href="@{/online}" class="menu-item menu-5">온라인 주문</a>
  </div>

  <!-- Additional Options -->
  <div id="loginButton" class="extra-item login">로그인</div>
  <div class="extra-item cart">장바구니</div>
  <div class="extra-item mypage">마이페이지</div>
</div>


<main class="detail-news">
  <section id="newsdetail">
    <h1 id="newsTitle"></h1>
    <div id="newsImageContainer"></div> <!-- 여기에 이미지가 동적으로 추가됩니다 -->
    <div id="newsContent"></div>

  </section>

  <style>
    #newsImageContainer {
      display: flex;           /* Flexbox 사용 */
      flex-direction: column;  /* 세로 정렬 */
      align-items: center;     /* 가운데 정렬 */
      gap: 20px;               /* 이미지 간격 */
    }
    .news-image {
      width: 80%;              /* 너비 80% 설정 */
      max-width: 600px;        /* 최대 너비 600px */
      height: auto;            /* 비율 유지 */
      object-fit: contain;     /* 이미지가 잘리지 않도록 */
    }
  </style>

<footer>
  <p>서울시 서초구 강남대로 535 프린스빌딩 15층 대표 : INSOO CHO(인수조) 전화 : 02-797-5036 사업자등록번호 : 101-84-04143</p>
</footer>
</html>
