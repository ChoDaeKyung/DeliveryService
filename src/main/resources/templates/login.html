<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">

</head>
<body>
<div class="navbar">
    <div class="rectangle7"></div>
    <a th:href="@{/main}" class="logo"></a>

    <div class="menu" id="menuList">
        <a th:href="@{/menu}" class="menu-item menu-1">메뉴소개</a>
        <a th:href="@{/howtouse}" class="menu-item menu-2">이용방법</a>
        <div class="dropdown">
            <a class="menu-item menu-3" onclick="toggleDropdown()">커뮤니티</a>
            <div class="dropdown-content">
                <a th:href="@{/news}">새소식</a>
                <a th:href="@{/review}">리뷰</a>
            </div>
        </div>
        <a th:href="@{/market}" class="menu-item menu-4">가맹점</a>
        <a th:href="@{/online}" class="menu-item menu-5">온라인 주문</a>
    </div>
    <div class="extra-item login">로그인</div>
    <div class="extra-item cart">장바구니</div>
    <div class="extra-item mypage">마이페이지</div>
</div>
<main class="main-content">
<div class="login-wrap">
    <div class="login-html">
        <input id="sign-in" type="radio" name="tab" class="sign-in" checked>
        <label for="sign-in" class="tab">Sign In</label>
        <input id="sign-up" type="radio" name="tab" class="sign-up">
        <label for="sign-up" class="tab">Sign Up</label>

        <div class="login-form">
            <!-- Sign In Form -->
            <div class="sign-in-htm">
                <h2>Sign In</h2>
                <form id="signin-form-content">
                    <div class="group">
                        <input type="text" id="signin-id" placeholder="Enter your ID" required>
                    </div>
                    <div class="group">
                        <input type="password" id="signin-password" placeholder="Enter your password" required>
                    </div>
                    <div style="text-align: center" class="group">
                        <button id="login-button" class="btn btn-success">Sign In</button>
                    </div>
                </form>
                <div class="social-login">
                    <div class="rectangle-10">
                        <button class="naver">네이버 로그인</button>
                        <button class="kakao-login">카카오 로그인</button>
                        <button class="google">구글 로그인</button>
                    </div>
                </div>
            </div>

            <!-- Sign Up Form -->
            <!-- Sign Up Form -->
            <div class="sign-up-htm">
                <form id="signup-form-content">
                    <div class="group">
                        <input type="text" id="signup-id" placeholder="ID" required>
                        <button type="button" id="check-id-btn" class="btn btn-info">중복 검사</button>
                        <p id="id-status"></p> <!-- ID 중복 검사 결과 표시 -->
                    </div>
                    <div class="group">
                        <input type="password" id="signup-password" placeholder="Password" required>
                    </div>
                    <div class="group">
                        <input type="text" id="signup-name" placeholder="Full Name" required>
                    </div>
                    <div class="group">
                        <input type="text" id="signup-nickname" placeholder="Nickname" required>
                        <button type="button" id="check-nickname-btn" class="btn btn-info">중복 검사</button>
                        <p id="nickname-status"></p> <!-- 닉네임 중복 검사 결과 표시 -->
                    </div>
                    <div class="group">
                        <select id="signup-role" required>
                            <option value="ROLE_USER" selected>User</option>
                            <option value="ROLE_RIDER">Rider</option>
                            <option value="ROLE_MANAGER">Manager</option>
                        </select>
                    </div>
                    <div class="group">
                        <input type="email" id="signup-email" placeholder="Email" required>
                        <button id="send-verification-btn" class="btn btn-secondary">이메일 전송</button>
                        <p id="email-status"></p>
                    </div>
                    <div class="group">
                        <input type="text" id="verification-code" placeholder="인증번호" class="input-field" required />
                        <button type="button" id="verify-button" class="btn btn-secondary">인증번호 확인</button>
                        <p id="email-status-num"></p>
                    </div>
                    <div style="text-align: center" class="group">
                        <button type="submit" id="submit-button" class="btn btn-success">Sign Up</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
<footer>
    <p>서울시 서초구 강남대로 535 프린스빌딩 15층 대표 : INSOO CHO(인수조) 전화 : 02-797-5036 사업자등록번호 : 101-84-04143</p>
</footer>
</main>

<body th:data-login-service-url="${loginServiceUrl}">
</body>
<script th:src="@{/js/login.js}"></script>
<script th:src="@{/js/join.js}"></script>
</body>
</html>
