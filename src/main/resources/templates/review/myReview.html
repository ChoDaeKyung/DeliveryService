<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/user.css}" rel="stylesheet">
    <link th:href="@{/css/availableReview.css}" rel="stylesheet">
    <script th:src="@{/js/community/myReviewList.js}"></script>
    <title>작성 가능한 리뷰</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

</head>
<body>



<div id="reviewModal" class="review-modal">
    <div class="review-modal-content">
        <span class="close-modal">&times;</span>
        <div class="modal-body">
            <div class="modal-image-container">
                <div class="image-slider">
                    <button class="slider-prev-btn">&lt;</button>
                    <div class="slider-container"></div>
                    <button class="slider-next-btn">&gt;</button>
                </div>
            </div>
            <div class="modal-info">
                <div class="modal-header">
                    <div class="modal-author">
                        <i class="fa fa-user-circle"></i>
                        <span id="modalAuthor"></span>
                    </div>
                    <div class="modal-rating"></div>
                </div>
                <div class="modal-content-wrapper">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <h2 class="modal-content">
                        <p id="modalContent"></p>
                    </h2>
                </div>
                <div class="modal-footer">
                    <span id="modalDate"></span>
                    <span id="modalId"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">SWFM</div>
        <nav>
            <ul>
                <li><a href="#">봄날에 디자인연...</a></li>
                <li><a href="#">디자인모드</a></li>
                <li><a th:href="@{/index}">사이트 바로가기</a></li>
            </ul>
            <h4>사이트 관리</h4>
            <ul>
                <li><a th:href="@{/mypage/cartList}">장바구니</a></li>
                <li><a href="#">주문내역</a></li>
                <li><a href="#">쿠폰현황</a></li>
                <li><a href="#">내정보</a></li>
                <li><a href="#">환경설정</a></li>
            </ul>
            <h4>리뷰 관리</h4>
            <ul>
                <li><a href="#" th:href="@{/mypage/availableReview}">작성 가능한 리뷰</a></li>
                <li><a href="#" class="active">작성한 리뷰</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
        <h1>작성한 리뷰</h1>
        <div id="pending-review-list" class="review-list">
            <!-- JavaScript에서 동적으로 리뷰 항목 추가 -->
        </div>
        <div id="paginationContainer" class="pagination-container">
            <!-- JavaScript에서 동적으로 페이지네이션 추가 -->
        </div>
    </main>
</div>

<!-- 모달 영역 -->

</body>
</html>
