<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/user.css}" rel="stylesheet">
    <link th:href="@{/css/availableReview.css}" rel="stylesheet">
    <script th:src="@{/js/community/availableReview.js}"></script>
    <script th:src="@{/js/community/availableReviewList.js}"></script>
    <title>작성 가능한 리뷰</title>
</head>
<body>
<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">SWFM</div>
        <nav>
            <ul>
                <li><a href="#">봄날에 디자인연...</a></li>
                <li><a href="#">디자인모드</a></li>
                <li><a th:href="@{/index}">사이트 바로가기</a></li>
            </ul>
            <h4>사이트 관리</h4>
            <ul>
                <li><a th:href="@{/mypage/cartList}">장바구니</a></li>
                <li><a href="#">주문내역</a></li>
                <li><a href="#">쿠폰현황</a></li>
                <li><a href="#">내정보</a></li>
                <li><a href="#">환경설정</a></li>
            </ul>
            <h4>리뷰 관리</h4>
            <ul>
                <li><a href="#" class="active">작성 가능한 리뷰</a></li>
                <li><a href="#">작성한 리뷰</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
        <h1>작성 가능한 리뷰</h1>
        <div id="pending-review-list" class="review-list">
            <!-- JavaScript에서 동적으로 리뷰 항목 추가 -->
        </div>
        <div id="paginationContainer" class="pagination-container">
            <!-- JavaScript에서 동적으로 페이지네이션 추가 -->
        </div>
    </main>
</div>

<!-- 모달 영역 -->
<div id="reviewModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <section id="newscreate" style="background: white; padding: 20px; border-radius: 8px; width: 500px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; font-size: 1.5em; color: #333;">리뷰 작성</h2>
        <form id="newsForm" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- 제목 작성 -->
            <div>
                <label for="title" style="display: block; font-weight: bold; margin-bottom: 5px;">제목</label>
                <input type="text" id="title" name="title" placeholder="제목을 입력하세요"
                       style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <!-- 내용 작성 -->
            <div>
                <label for="content" style="display: block; font-weight: bold; margin-bottom: 5px;">내용</label>
                <textarea id="content" name="content" rows="5" placeholder="내용을 입력하세요"
                          style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: none;"></textarea>
            </div>
            <!-- 사진 첨부 -->
            <div>
                <label for="image" style="display: block; font-weight: bold; margin-bottom: 5px;">사진 첨부</label>
                <input type="file" id="image" name="image" accept="image/*" multiple
                       style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <!-- 별점 -->
            <div>
                <label for="rating" style="font-weight: bold;">별점:</label>
                <span class="star">
                    ★★★★★
                    <span>★★★★★</span>
                    <input type="range" id="rating" name="rating" oninput="drawStar(this)" value="1" step="1" min="0" max="10">
                </span>
            </div>
            <!-- 완료 버튼 -->
            <button type="button" onclick="createReview();">완료 !</button>
            <button type="button" onclick="closeModal();">취소</button>
        </form>
    </section>
</div>
</body>
</html>
